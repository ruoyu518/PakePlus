<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>未命名项目1</title>
  <link rel="stylesheet" href="jsxgraph.css">
  <script src="jsxgraphcore.js"></script>
  <style>
    /* ==================== 主题变量 ==================== */
    :root {
      --bg-body: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #0d1117;
      --bg-input: #0d1117;
      --bg-slider: #21262d;
      --bg-item: #161b22;
      --bg-apply: #238636;
      --bg-apply-hover: #2ea043;
      --bg-reset: #21262d;
      --border-c: #30363d;
      --border-sub: #21262d;
      --text-pri: #c9d1d9;
      --text-sec: #8b949e;
      --text-muted: #6e7681;
      --text-label: #484f58;
      --c-blue: #58a6ff;
      --c-green: #7ee787;
      --c-green2: #3fb950;
      --c-orange: #f0883e;
      --c-purple: #d2a8ff;
      --c-red: #f85149;
      --c-yellow: #ffa657;
      --c-teal: #2dd4bf;
      --c-magenta: #f472b6;
      --c-brown: #d4a574;
      --c-badge: #238636;
      --c-scrollbar: #30363d;
      --c-circle-fill: #0d1117;
      --c-axis: #484f58;
    }
    [data-theme="light"] {
      --bg-body: #f6f8fa;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f6f8fa;
      --bg-slider: #d0d7de;
      --bg-item: #f6f8fa;
      --bg-apply: #1a7f37;
      --bg-apply-hover: #2da44e;
      --bg-reset: #eaeef2;
      --border-c: #d0d7de;
      --border-sub: #eaeef2;
      --text-pri: #1f2328;
      --text-sec: #656d76;
      --text-muted: #8c959f;
      --text-label: #afb8c1;
      --c-blue: #0969da;
      --c-green: #1a7f37;
      --c-green2: #1a7f37;
      --c-orange: #bc4c00;
      --c-purple: #8250df;
      --c-red: #cf222e;
      --c-yellow: #9a6700;
      --c-teal: #0d7377;
      --c-magenta: #a8377a;
      --c-brown: #7c4a03;
      --c-badge: #1a7f37;
      --c-scrollbar: #d0d7de;
      --c-circle-fill: #f6f8fa;
      --c-axis: #afb8c1;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-body);color:var(--text-pri);overflow:hidden;height:100vh}
    .app{display:flex;flex-direction:column;height:100vh}

    /* 第一行：软件名 + 文件状态 */
    .topbar{display:flex;align-items:center;gap:16px;padding:12px 32px;background:var(--bg-panel);border-bottom:1px solid var(--border-c)}
    .topbar h1{font-size:28px;font-weight:600;color:var(--c-blue);white-space:nowrap}
    .badge{font-size:10px;background:var(--c-badge);color:#fff;border-radius:10px;padding:2px 8px;margin-left:8px}
    .topbar .filebar-status{font-size:11px;color:var(--text-muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}

    /* 第二行：菜单栏 */
    .menubar{display:flex;align-items:center;gap:0;padding:0 16px;background:var(--bg-panel);border-bottom:1px solid var(--border-c);position:relative;z-index:100}
    .menu{position:relative}
    .menu-btn{background:transparent;color:var(--text-pri);border:none;padding:7px 16px;cursor:pointer;font-size:13px;font-family:inherit;transition:background .12s}
    .menu-btn:hover{background:var(--bg-slider)}
    .menu-btn.open{background:var(--bg-slider)}
    .menu-dropdown{position:absolute;top:100%;left:0;min-width:140px;background:var(--bg-panel);border:1px solid var(--border-c);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:4px;display:none;z-index:200}
    .menu-dropdown.show{display:block}
    .menu-item{display:flex;align-items:center;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text-pri);border-radius:4px;transition:background .1s}
    .menu-item:hover{background:var(--bg-slider)}
    .menu-sep{height:1px;background:var(--border-c);margin:4px 0}
    .menu-item-check{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text-pri);border-radius:4px;transition:background .1s;user-select:none}
    .menu-item-check:hover{background:var(--bg-slider)}
    .menu-item-check .check-box{display:inline-block;width:16px;text-align:center;font-size:12px;color:var(--c-green);font-weight:bold}
    .menu-item-check.hidden .check-box{visibility:hidden}
    .window-hidden{display:none !important}

    /* 菜单内输入控件 */
    .menu-input-group{padding:8px 12px;min-width:220px}
    .menu-input-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .menu-input-row:last-child{margin-bottom:0}
    .menu-input-row label{font-size:12px;color:var(--text-sec);white-space:nowrap}
    .menu-input-row label span{font-size:10px;color:var(--text-muted);margin-left:2px}
    .menu-input-row input[type=number]{width:80px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:12px;font-family:Consolas,monospace;padding:3px 6px;text-align:right;outline:none}
    .menu-input-row input[type=number]:focus{border-color:var(--c-blue)}
    .menu-input-row input[type=number]::-webkit-inner-spin-button,.menu-input-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .menu-cost-row{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:11px}
    .menu-cost-row .zone-name{font-weight:700;min-width:32px;font-size:12px}
    .menu-cost-row select{background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--text-pri);font-size:11px;padding:2px 4px;outline:none;cursor:pointer}
    .menu-cost-row select:focus{border-color:var(--c-blue)}
    .menu-cost-row input[type=number]{width:64px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:11px;font-family:Consolas,monospace;padding:2px 4px;text-align:right;outline:none}
    .menu-cost-row input[type=number]:focus{border-color:var(--c-blue)}
    .menu-cost-row input[type=number]::-webkit-inner-spin-button,.menu-cost-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .menu-cost-row .zone-unit{color:var(--text-muted);font-size:9px;white-space:nowrap}
    .menu-screen-row{display:flex;align-items:center;gap:8px;padding:8px 12px;min-width:200px}
    .menu-screen-row label{font-size:12px;color:var(--text-sec);white-space:nowrap}
    .menu-screen-row input[type=number]{width:72px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:12px;font-family:Consolas,monospace;padding:3px 6px;text-align:right;outline:none}
    .menu-screen-row input[type=number]:focus{border-color:var(--c-blue)}
    .menu-screen-row input[type=number]::-webkit-inner-spin-button,.menu-screen-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .menu-screen-row .x-sep{color:var(--text-sec);font-size:12px}
    .menu-screen-row .px-unit{color:var(--text-muted);font-size:10px}

    /* 预估造价只读显示 */
    .cost-display{display:flex;flex-direction:column;gap:3px}
    .cost-display-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border-sub)}
    .cost-display-row:last-child{border-bottom:none}
    .cost-display-row .cd-name{font-weight:700;min-width:32px;font-size:11px}
    .cost-display-row .cd-area{color:var(--text-sec);font-family:Consolas,monospace;font-size:10px}
    .cost-display-row .cd-price{color:var(--text-muted);font-size:10px}
    .cost-display-row .cd-subtotal{margin-left:auto;font-family:Consolas,monospace;font-weight:600;font-size:11px;color:var(--c-orange)}

    /* 映射弹窗 */
    .dialog-box.dialog-wide{min-width:500px;max-width:600px;max-height:80vh}
    .dialog-box.dialog-wide .dialog-body{max-height:60vh;overflow-y:auto;padding:12px 16px}
    .dialog-box.dialog-wide .dialog-body .data-row{font-size:12px}

    /* 弹窗 */
    .dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center}
    .dialog-overlay.show{display:flex}
    .dialog-box{background:var(--bg-panel);border:1px solid var(--border-c);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);min-width:280px;max-width:400px;overflow:hidden}
    .dialog-box.dialog-medium{min-width:340px;max-width:460px}
    .dialog-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border-c);background:var(--bg-card)}
    .dialog-header span{font-size:14px;font-weight:600;color:var(--c-blue)}
    .dialog-close{background:none;border:none;color:var(--text-sec);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
    .dialog-close:hover{color:var(--text-pri)}
    .dialog-body{padding:16px}
    .dialog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .dialog-row:last-child{margin-bottom:0}
    .dialog-row label{font-size:13px;color:var(--text-sec)}

    /* 弹窗内输入控件复用菜单样式 */
    .dialog-input-group{display:flex;flex-direction:column;gap:12px}
    .dialog-input-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .dialog-input-row label{font-size:13px;color:var(--text-sec);white-space:nowrap}
    .dialog-input-row label span{font-size:11px;color:var(--text-muted);margin-left:2px}
    .dialog-input-row input[type=number]{width:100px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:13px;font-family:Consolas,monospace;padding:5px 8px;text-align:right;outline:none}
    .dialog-input-row input[type=number]:focus{border-color:var(--c-blue)}
    .dialog-input-row input[type=number]::-webkit-inner-spin-button,.dialog-input-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .dialog-cost-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-sub)}
    .dialog-cost-row:last-child{border-bottom:none}
    .dialog-cost-row .zone-name{font-weight:700;min-width:36px;font-size:13px}
    .dialog-cost-row select{background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--text-pri);font-size:12px;padding:4px 6px;outline:none;cursor:pointer}
    .dialog-cost-row select:focus{border-color:var(--c-blue)}
    .dialog-cost-row input[type=number]{width:80px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:12px;font-family:Consolas,monospace;padding:4px 6px;text-align:right;outline:none}
    .dialog-cost-row input[type=number]:focus{border-color:var(--c-blue)}
    .dialog-cost-row input[type=number]::-webkit-inner-spin-button,.dialog-cost-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .dialog-cost-row .zone-unit{color:var(--text-muted);font-size:10px;white-space:nowrap}
    .dialog-screen-row{display:flex;align-items:center;gap:8px}
    .dialog-screen-row label{font-size:13px;color:var(--text-sec);white-space:nowrap}
    .dialog-screen-row input[type=number]{width:90px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:13px;font-family:Consolas,monospace;padding:5px 8px;text-align:right;outline:none}
    .dialog-screen-row input[type=number]:focus{border-color:var(--c-blue)}
    .dialog-screen-row input[type=number]::-webkit-inner-spin-button,.dialog-screen-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .dialog-screen-row .x-sep{color:var(--text-sec);font-size:13px}
    .dialog-screen-row .px-unit{color:var(--text-muted);font-size:11px}

    /* 映射计算折叠区 */
    .mapping-collapse-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;border-top:1px solid var(--border-sub);margin-top:6px;user-select:none}
    .mapping-collapse-toggle .toggle-label{font-size:11px;color:var(--text-sec);font-weight:600}
    .mapping-collapse-toggle .toggle-arrow{font-size:12px;color:var(--text-sec);transition:transform .2s}
    .mapping-collapse-toggle.expanded .toggle-arrow{transform:rotate(90deg)}
    .mapping-detail-wrap{max-height:0;overflow:hidden;transition:max-height .3s ease}
    .mapping-detail-wrap.expanded{max-height:3000px}

    /* 映射弹窗公式行 */
    .formula-row{padding:6px 0;border-bottom:1px solid var(--border-sub)}
    .formula-row:last-child{border-bottom:none}
    .formula-name{font-size:11px;color:var(--text-sec);margin-bottom:2px}
    .formula-expr{font-size:12px;color:var(--c-purple);font-family:Consolas,monospace;margin-bottom:2px;word-break:break-all}
    .formula-calc{font-size:11px;color:var(--text-muted);font-family:Consolas,monospace;margin-bottom:2px;word-break:break-all}
    .formula-result{font-size:13px;color:var(--c-green);font-family:Consolas,monospace;font-weight:600}
    .dialog-row .scale-value{font-family:Consolas,monospace;font-size:14px;color:var(--c-blue);font-weight:700;min-width:40px;text-align:right}
    .dialog-row input[type=range]{width:160px;-webkit-appearance:none;height:6px;background:var(--bg-slider);border-radius:3px;outline:none}
    .dialog-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--c-blue);border-radius:50%;cursor:pointer}
    .theme-options{display:flex;gap:8px}
    .theme-options button{flex:1;background:var(--bg-item);color:var(--text-pri);border:1px solid var(--border-c);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .12s}
    .theme-options button:hover{background:var(--bg-slider)}
    .theme-options button.active{background:var(--c-blue);color:#fff;border-color:var(--c-blue)}

    /* 主体 */
    .main{display:flex;flex:1;min-height:0}

    /* 可视化区：立面 + 顶面 + 输出，占 2/3 */
    .viz-area{flex:2;display:flex;flex-direction:column;min-width:0}
    .diagrams-row{flex:1;display:flex;flex-direction:column;min-height:0}
    .view-half{flex:1;position:relative;min-height:0;min-width:0;background:var(--bg-panel)}
    .view-half:first-child{border-bottom:1px solid var(--border-c)}
    .view-half>div{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
    .view-label{position:absolute;top:6px;left:8px;font-size:14px;color:var(--c-blue);font-weight:600;z-index:10;pointer-events:none}

    /* 横屏自适应：立面图和顶面图左右并排，面板固定宽度 */
    @media (min-aspect-ratio:12/10){
      .diagrams-row{flex-direction:row}
      .view-half:first-child{border-bottom:none;border-right:1px solid var(--border-c)}
      .panel{flex:0 0 380px}
      .output-view{max-height:38%}
    }

    /* 输出示意图 */
    .output-view{flex:0 0 auto;min-height:120px;max-height:45%;position:relative;overflow:auto;background:var(--bg-panel);border-top:1px solid var(--border-c);padding:28px 12px 10px}
    .output-view::-webkit-scrollbar{height:6px;width:6px}
    .output-view::-webkit-scrollbar-thumb{background:var(--c-scrollbar);border-radius:3px}
    #outputDiagram{display:flex;flex-direction:column;gap:10px}
    .output-section{display:flex;flex-direction:column;gap:4px;min-width:max-content}
    .output-section-title{font-size:12px;color:var(--text-sec);font-weight:600;margin-bottom:2px;padding-left:4px}
    .section-coord{font-family:Consolas,monospace;font-size:9px;color:var(--text-muted);padding-left:4px;margin-bottom:3px}
    .output-row{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
    .output-rect{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid;border-radius:0;flex-shrink:0;padding:10px 12px;box-sizing:border-box}
    .output-rect .rect-name{font-size:12px;font-weight:bold;margin-bottom:3px;white-space:nowrap}
    .output-rect .rect-dims{font-family:Consolas,monospace;font-size:10px;opacity:.85;white-space:nowrap}

    /* 右侧面板：参数数据，占 1/3 */
    .panel{flex:1;overflow-y:auto;background:var(--bg-panel);border-left:1px solid var(--border-c);display:flex;flex-direction:column;gap:8px;padding:8px;min-width:0}
    .panel::-webkit-scrollbar{width:6px}
    .panel::-webkit-scrollbar-thumb{background:var(--c-scrollbar);border-radius:3px}

    .card{background:var(--bg-card);border:1px solid var(--border-c);border-radius:8px;padding:12px}
    .card h3{color:var(--c-blue);font-size:14px;margin-bottom:8px}

    /* 硬件参数 */
    .slider-group{margin-bottom:10px}
    .slider-group label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-sec);margin-bottom:4px}
    .slider-group label span{font-size:11px}
    .channel-label{font-size:11px}
    .channel-unit-sm{font-size:10px}
    .channel-x{font-size:12px}
    .channel-px{font-size:11px}
    .slider-row{display:flex;align-items:center;gap:8px}
    .slider-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;background:var(--bg-slider);border-radius:3px;outline:none}
    .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--c-blue);border-radius:50%;cursor:pointer}
    .slider-row input[type=number]{width:72px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:5px;color:var(--c-green);font-size:12px;font-family:Consolas,monospace;padding:3px 6px;text-align:right;outline:none}
    .slider-row input[type=number]:focus{border-color:var(--c-blue)}
    .slider-row input[type=number]::-webkit-inner-spin-button,.slider-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

    .btn-row{display:flex;gap:8px}
    button.apply{background:var(--bg-apply);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;flex:1}
    button.apply:hover{background:var(--bg-apply-hover)}
    button.reset{background:var(--bg-reset);color:var(--text-sec);border:1px solid var(--border-c);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;flex:1}

    /* 映射结果——大字 */
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
    .result-item{background:var(--bg-item);border:1px solid var(--border-c);border-radius:6px;padding:8px 10px;text-align:center}
    .result-item .r-label{font-size:10px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px}
    .result-item .r-value{font-size:20px;font-weight:700;font-family:Consolas,monospace;margin-top:2px}
    .result-item .r-value.green{color:var(--c-green)}
    .result-item .r-value.orange{color:var(--c-orange)}
    .result-item .r-value.blue{color:var(--c-blue)}
    .result-item .r-value.purple{color:var(--c-purple)}
    .result-item .r-unit{font-size:11px;color:var(--text-sec);margin-left:2px}

    /* 数据行——中等字 */
    .data-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border-sub);font-size:13px}
    .data-row .label{color:var(--text-sec)}
    .data-row .value{color:var(--text-pri);font-weight:600;font-family:Consolas,monospace;font-size:13px}
    .data-row .value.hl{color:var(--c-orange)}
    .data-row .value.bl{color:var(--c-blue)}
    .data-row .value.gr{color:var(--c-green)}
    .data-row .value.pp{color:var(--c-purple)}
    .data-row .value.rd{color:var(--c-red)}

    .section-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border-sub)}

    /* 分屏落地——大数字行 */
    .ms-big{background:var(--bg-item);border:1px solid var(--border-c);border-radius:6px;padding:8px 10px;text-align:center;margin-bottom:6px}
    .ms-big .ms-label{font-size:10px;color:var(--text-sec)}
    .ms-big .ms-value{font-size:22px;font-weight:700;font-family:Consolas,monospace;margin-top:2px}

    /* 折叠卡片 */
    .card-collapsible .card-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
    .card-collapsible .card-toggle h3{margin-bottom:0}
    .card-collapsible .card-toggle .toggle-hint{font-size:11px;color:var(--c-blue);font-weight:normal}
    .card-collapsible .card-toggle::after{content:'▾';font-size:12px;color:var(--text-sec);transition:transform .2s;margin-left:8px}
    .card-collapsible.collapsed .card-toggle::after{transform:rotate(-90deg)}
    .card-collapsible .card-body{overflow:hidden;transition:max-height .3s ease,opacity .2s;padding-top:8px}
    .card-collapsible.collapsed .card-body{max-height:0;opacity:0;padding-top:0;overflow:hidden}

    /* 预估造价 */
    .cost-zones{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
    .cost-zone{display:flex;align-items:center;gap:4px;font-size:10px}
    .cost-zone .zone-name{font-weight:700;min-width:32px;font-size:11px}
    .cost-zone select{background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--text-pri);font-size:10px;padding:2px 4px;outline:none;cursor:pointer}
    .cost-zone select:focus{border-color:var(--c-blue)}
    .cost-zone input[type=number]{width:60px;background:var(--bg-input);border:1px solid var(--border-c);border-radius:4px;color:var(--c-green);font-size:10px;font-family:Consolas,monospace;padding:2px 4px;text-align:right;outline:none}
    .cost-zone input[type=number]:focus{border-color:var(--c-blue)}
    .cost-zone input[type=number]::-webkit-inner-spin-button,.cost-zone input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    .cost-zone .zone-unit{color:var(--text-muted);font-size:9px;white-space:nowrap}
    .cost-zone .zone-subtotal{margin-left:auto;font-family:Consolas,monospace;font-size:10px;color:var(--text-sec);white-space:nowrap}
    .cost-estimate{text-align:center}
    .cost-estimate .cost-label{font-size:10px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px}
    .cost-estimate .cost-value{font-size:24px;font-weight:700;color:var(--c-orange);font-family:Consolas,monospace;margin-top:2px}

    /* 输出示意图动画 */
    .output-rect{transition:min-width .25s ease,min-height .25s ease}
  </style>
</head>
<body>
<div class="app">
  <!-- 第一行：软件名 + 文件名状态 -->

<!-- 硬件弹窗 -->

<script>
// ==================== 菜单管理 ====================
function toggleMenu(name, e) {
  if (e) e.stopPropagation();
  var dd = document.getElementById('menu' + name.charAt(0).toUpperCase() + name.slice(1));
  var btn = e ? e.target : null;
  var wasOpen = dd.classList.contains('show');
  closeMenus();
  if (!wasOpen) {
    dd.classList.add('show');
    if (btn) btn.classList.add('open');
  }
}
function closeMenus() {
  document.querySelectorAll('.menu-dropdown').forEach(function(d) { d.classList.remove('show'); });
  document.querySelectorAll('.menu-btn').forEach(function(b) { b.classList.remove('open'); });
}
document.addEventListener('click', function() { closeMenus(); });

// ==================== 弹窗管理 ====================
function openDialog(name) {
  var id = 'dialog' + name.charAt(0).toUpperCase() + name.slice(1);
  var el = document.getElementById(id);
  if (el) el.classList.add('show');
}
function closeDialog(name) {
  var id = 'dialog' + name.charAt(0).toUpperCase() + name.slice(1);
  var el = document.getElementById(id);
  if (el) el.classList.remove('show');
}

// ==================== 字体缩放 ====================
var FONT_SIZES = {
  '.topbar h1': 28, '.topbar .filebar-status': 11,
  '.menu-btn': 13, '.menu-item': 13, '.menu-item-check': 13, '.menu-item-check .check-box': 12,
  '.dialog-input-row label': 13, '.dialog-input-row label span': 11,
  '.dialog-input-row input[type=number]': 13,
  '.dialog-cost-row .zone-name': 13, '.dialog-cost-row select': 12,
  '.dialog-cost-row input[type=number]': 12, '.dialog-cost-row .zone-unit': 10,
  '.dialog-screen-row label': 13, '.dialog-screen-row input[type=number]': 13,
  '.dialog-screen-row .x-sep': 13, '.dialog-screen-row .px-unit': 11,
  '.view-label': 14,
  '.output-section-title': 12, '.section-coord': 9,
  '.output-rect .rect-name': 12, '.output-rect .rect-dims': 10,
  '.card h3': 14, '.slider-group label': 12, '.slider-group label span': 11,
  '.slider-row input[type=number]': 12,
  '.result-item .r-label': 10, '.result-item .r-value': 20,
  '.result-item .r-unit': 11,
  '.data-row': 13, '.data-row .value': 13, '.data-row .label': 13,
  '.section-title': 11,
  '.ms-big .ms-label': 10, '.ms-big .ms-value': 22, '.ms-big .ms-value span': 13,
  '.cost-display-row': 11, '.cost-display-row .cd-name': 11,
  '.cost-display-row .cd-area': 10, '.cost-display-row .cd-price': 10,
  '.cost-display-row .cd-subtotal': 11,
  '.cost-estimate .cost-label': 10, '.cost-estimate .cost-value': 24,
  '.output-total': 12, '.output-total strong': 14,
  '.dialog-header span': 14, '.dialog-row label': 13,
  '.dialog-row .scale-value': 14, '.theme-options button': 13,
  '.mapping-collapse-toggle .toggle-label': 11, '.mapping-collapse-toggle .toggle-arrow': 12,
  '.formula-row .formula-name': 11, '.formula-row .formula-expr': 12,
  '.formula-row .formula-calc': 11, '.formula-row .formula-result': 13
};
function setFontScale(scale) {
  scale = parseFloat(scale);
  if (isNaN(scale)) scale = 1;
  var valEl = document.getElementById('fontScaleValue');
  if (valEl) valEl.textContent = scale.toFixed(1) + 'x';
  var slider = document.getElementById('fontScaleSlider');
  if (slider) slider.value = scale;
  // 生成覆盖样式
  var css = '';
  for (var sel in FONT_SIZES) {
    if (sel.indexOf('::after') >= 0) continue; // 伪元素用JS无法覆盖，跳过
    css += sel + '{font-size:' + (FONT_SIZES[sel] * scale).toFixed(1) + 'px !important}\n';
  }
  var styleEl = document.getElementById('fontScaleStyle');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'fontScaleStyle';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = css;
  localStorage.setItem('rvr-font-scale', scale);
  // 重绘以更新动态生成的文字
  setTimeout(function() { if (typeof onParamChange === 'function') onParamChange(); }, 10);
}

// ==================== 主题管理 ====================
function setTheme(theme) {
  var actual = theme;
  if (theme === 'auto') {
    actual = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', actual);
  localStorage.setItem('rvr-theme', theme);
  document.querySelectorAll('[data-tb]').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tb') === theme);
  });
  // 重绘JSXGraph以更新颜色
  setTimeout(function() {
    if (typeof onParamChange === 'function') onParamChange();
  }, 50);
}

// 主题相关颜色（供JSXGraph绘图使用）
function tColors() {
  var isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) return {
    bg: '#ffffff', text: '#1f2328', textSec: '#656d76', textMuted: '#8c959f',
    blue: '#0969da', green: '#1a7f37', greenB: '#1a7f37',
    orange: '#bc4c00', purple: '#8250df', red: '#cf222e', yellow: '#9a6700',
    teal: '#0d7377', magenta: '#a8377a', brown: '#7c4a03',
    border: '#d0d7de', grid: '#eaeef2', axis: '#afb8c1'
  };
  return {
    bg: '#0d1117', text: '#c9d1d9', textSec: '#8b949e', textMuted: '#6e7681',
    blue: '#58a6ff', green: '#3fb950', greenB: '#7ee787',
    orange: '#f0883e', purple: '#d2a8ff', red: '#f85149', yellow: '#ffa657',
    teal: '#2dd4bf', magenta: '#f472b6', brown: '#d4a574',
    border: '#30363d', grid: '#21262d', axis: '#484f58'
  };
}

// 副屏颜色数组（按序号分配，支持多块副屏区分）
function subScreenColors(tc) {
  return [tc.orange, tc.teal, tc.magenta, tc.brown];
}

// 监听系统主题变化（自动模式下）
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
  if (localStorage.getItem('rvr-theme') === 'auto') setTheme('auto');
});

// ==================== 文件操作（新建/打开/保存/另存为） ====================
var currentFileName = null;

function newParams() {
  resetParams();
  currentFileName = null;
  document.getElementById('fileStatus').textContent = '新建（未保存）';
}

function getParamsString() {
  var P = getParams();
  var C = computeAll(P);
  var lines = [];
  lines.push('# RVR 项目参数与计算结果文件');
  lines.push('# 生成时间: ' + new Date().toLocaleString('zh-CN'));
  lines.push('# 项目: ' + (currentFileName ? currentFileName.replace(/\.[^.]+$/, '') : '未命名项目'));
  lines.push('');
  lines.push('# ===== 一、输入参数 =====');
  lines.push('圆柱直径_D=' + P.D.toFixed(3));
  lines.push('圆柱高度_H=' + P.h.toFixed(2));
  lines.push('像素间距_p=' + (P.p * 1000).toFixed(2));
  lines.push('人眼高度_h=' + P.h_eye.toFixed(2));
  lines.push('通道宽度_W=' + P.chW);
  lines.push('通道高度_H=' + P.chH);
  lines.push('');
  lines.push('# ===== 二、屏幕造价配置 =====');
  ['top', 'wall', 'gnd'].forEach(function(z) {
    var sel = document.getElementById('zoneType_' + z);
    var price = document.getElementById('zonePrice_' + z);
    if (sel && price) {
      lines.push('屏幕类型_' + z + '=' + sel.value);
      lines.push('屏幕单价_' + z + '=' + price.value);
    }
  });
  lines.push('');
  lines.push('# ===== 三、计算结果（界面实时显示数据） =====');
  lines.push('# -- 全景图与像素规格 --');
  lines.push('全景图_水平像素_Nh=' + C.Nh.toLocaleString());
  lines.push('全景图_垂直像素_Nv=' + C.Nv.toLocaleString());
  lines.push('地面渲染像素_Ngnd=' + C.Ngnd.toLocaleString());
  lines.push('总像素数_Ntotal=' + fmtPx(C.N_total));
  lines.push('');
  lines.push('# -- 面积与像素 --');
  lines.push('结构半径_R=' + formatNum(C.R, 3) + ' m');
  lines.push('圆柱周长_C=' + formatNum(C.C, 3) + ' m');
  lines.push('半球表面积_A_hemi=' + fmtArea(C.A_hemi));
  lines.push('圆柱侧面积_A_wall=' + fmtArea(C.A_wall));
  lines.push('地面面积_A_gnd=' + fmtArea(C.A_gnd));
  lines.push('总显示面积_A_total=' + fmtArea(C.A_total));

  }

    });

  if (C.gndScreens && C.gndScreens.length) {
    C.gndScreens.forEach(function(s, i) {
      lines.push('地面屏_' + (i + 1) + '=' + s.w.toLocaleString() + ' × ' + s.h.toLocaleString() + ' px');
    });
  }
  lines.push('');
  lines.push('# -- 预估造价 --');
  var costZones = [
    { key: 'top', area: C.A_hemi, name: '顶面' },
    { key: 'wall', area: C.A_wall, name: '墙面' },
    { key: 'gnd', area: C.A_gnd, name: '地面' }
  ];
  var totalCost = 0;
  costZones.forEach(function(z) {
    var pe = document.getElementById('zonePrice_' + z.key);
    var price = pe ? parseFloat(pe.value) : 0;
    if (isNaN(price) || price < 0) price = 0;
    var cost = price * z.area;
    totalCost += cost;
    lines.push('造价_' + z.name + '=' + fmtArea(z.area) + ' × ¥' + price.toLocaleString() + '/m² = ¥' + cost.toFixed(0));
  });
  var costStr;
  if (totalCost >= 1e8) costStr = (totalCost / 1e8).toFixed(2) + ' 亿';
  else if (totalCost >= 1e4) costStr = (totalCost / 1e4).toFixed(1) + ' 万';
  else costStr = totalCost.toFixed(0);
  lines.push('预估总造价=' + costStr + ' (¥ ' + totalCost.toFixed(0) + ')');
  return lines.join('\n');
}

function openParams(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var params = {};
    var strParams = {};
    text.split('\n').forEach(function(line) {
      line = line.trim();
      if (line.startsWith('#') || !line) return;
      var idx = line.indexOf('=');
      if (idx < 0) return;
      var key = line.substring(0, idx).trim();
      var val = line.substring(idx + 1).trim();
      var numVal = parseFloat(val);
      if (!isNaN(numVal)) params[key] = numVal;
      strParams[key] = val;
    });
    if (params['圆柱直径_D'] !== undefined) setParam('D', params['圆柱直径_D']);
    if (params['圆柱高度_H'] !== undefined) setParam('H', params['圆柱高度_H']);
    if (params['像素间距_p'] !== undefined) setParam('P', params['像素间距_p']);
    if (params['人眼高度_h'] !== undefined) setParam('Eye', params['人眼高度_h']);
    if (params['通道宽度_W'] !== undefined) document.getElementById('numChW').value = parseInt(params['通道宽度_W']);
    if (params['通道高度_H'] !== undefined) document.getElementById('numChH').value = parseInt(params['通道高度_H']);
    ['top', 'wall', 'gnd'].forEach(function(z) {
      var typeKey = '屏幕类型_' + z;
      var priceKey = '屏幕单价_' + z;
      if (strParams[typeKey]) {
        var sel = document.getElementById('zoneType_' + z);
        if (sel) sel.value = strParams[typeKey];
      }
      if (params[priceKey] !== undefined) {
        var pe = document.getElementById('zonePrice_' + z);
        if (pe) pe.value = params[priceKey];
      }
    });
    currentFileName = file.name;
    document.getElementById('fileStatus').textContent = '已打开: ' + file.name;
    var projName = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('projectTitle').textContent = projName;
    onParamChange();
  };
  reader.readAsText(file, 'UTF-8');
  input.value = '';
}

// ==================== 滑块配置（对数滑块） ====================
var sliderConfigs = {
  D:   { min: 1,    max: 1000,  log: true,  decimals: 3 },
  H:   { min: 1,    max: 1000,  log: true,  decimals: 2 },
  P:   { min: 0.1,  max: 100,   log: true,  decimals: 2 },
  Eye: { min: 0.1,  max: 500,    log: false, decimals: 2 }
};

function logToVal(sv, min, max) {
  if (sv <= 0) return min;
  if (sv >= 10000) return max;
  var lr = Math.log(max / min);
  return min * Math.exp(lr * sv / 10000);
}

function valToLog(v, min, max) {
  if (v <= min) return 0;
  if (v >= max) return 10000;
  var lr = Math.log(max / min);
  return Math.round(10000 * Math.log(v / min) / lr);
}

function syncFromSlider(key) {
  var slider = document.getElementById('slider' + key);
  var num = document.getElementById('num' + key);
  var cfg = sliderConfigs[key];
  var v;
  if (cfg.log) {
    v = logToVal(parseFloat(slider.value), cfg.min, cfg.max);
  } else {
    v = parseFloat(slider.value);
  }
  num.value = v.toFixed(cfg.decimals);
  // Sync menu input
  var menuEl = document.getElementById('menu' + key);
  if (menuEl) menuEl.value = v.toFixed(cfg.decimals);
  onParamChange();
}

function syncFromNumber(key) {
  var num = document.getElementById('num' + key);
  var slider = document.getElementById('slider' + key);
  var cfg = sliderConfigs[key];
  var v = parseFloat(num.value);
  if (isNaN(v)) return;
  v = Math.max(cfg.min, Math.min(cfg.max, v));
  num.value = v.toFixed(cfg.decimals);
  if (slider) {
    if (cfg.log) {
      slider.value = valToLog(v, cfg.min, cfg.max);
    } else {
      slider.value = v;
    }
  }
  // Sync menu input
  var menuEl = document.getElementById('menu' + key);
  if (menuEl) menuEl.value = v.toFixed(cfg.decimals);
  onParamChange();
}

// ==================== 数值格式化 ====================
function formatNum(n, d) { return n.toFixed(d); }

function fmtLarge(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2) + 'G';
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4)  return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtArea(a) {
  if (a >= 1e6) return (a / 1e6).toFixed(2) + ' Mm²';
  if (a >= 1e3) return (a / 1e3).toFixed(2) + ' Km²';
  return a.toFixed(2) + ' m²';
}

function fmtPx(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' Gpx';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' Mpx';
  if (n >= 1e3) return (n / 1e3).toFixed(2) + ' Kpx';
  return n.toLocaleString() + ' px';
}

// ==================== 全部参数计算（29个推导参数 + 分屏落地） ====================
function computeAll(P) {
  var R = P.D / 2;
  var p = P.p;
  var h = P.h;
  var he = P.h_eye;

  // 几何尺寸 (5)
  var C = Math.PI * P.D;
  var A_hemi = 2 * Math.PI * R * R;
  var A_wall = C * h;
  var A_gnd = Math.PI * R * R;
  var A_total = A_hemi + A_wall + A_gnd;

  // 像素规格 (6)
  var Nh = Math.round(C / p);
  var Nv = Math.round(Nh / 2);
  var NvHemi = Math.round(Nv / 2);
  var NvWall = Math.round(h / p);
  var Ngnd = Math.round(P.D / p);
  var N_total = Nh * Nv;

  // 分界参数
  var phiTopRad = Math.atan((h - he) / R);
  var phiBotRad = Math.atan(-he / R);
  var phiTopDeg = phiTopRad * 180 / Math.PI;
  var phiBotDeg = phiBotRad * 180 / Math.PI;
  var rowTop = Math.round(Nv * (90 - phiTopDeg) / 180);
  var rowBot = Math.round(Nv * (90 - phiBotDeg) / 180);
  var rowHorizon = Math.round(Nv / 2);
  var rowsHemi = rowTop;
  var rowsWall = rowBot - rowTop;
  var rowsGround = Nv - rowBot;
  var rowsHemiPct = rowsHemi / Nv * 100;
  var rowsWallPct = rowsWall / Nv * 100;
  var rowsGroundPct = rowsGround / Nv * 100;

  // 人眼与质量
  var fovRad = 2 * Math.atan(R / he);
  var fovDeg = fovRad * 180 / Math.PI;
  var fl = 36 / (2 * Math.tan(fovRad / 2));
  var ppd = Nh / 360;

  // ---- 分屏落地 ----
  var chW = P.chW || 7680;
  var chH = P.chH || 4320;

  var mainPxW = Math.min(chW, Nh);
  var mainPxH = Math.min(chH, Nv);
  var mainHDeg = mainPxW / ppd;
  var mainVDeg = mainPxH / ppd;

  var scrH = Math.ceil(Nh / chW);
  var scrV = Math.ceil(Nv / chH);
  var scrTotal = scrH * scrV;

  var cellW = Math.ceil(Nh / scrH);
  var cellH = Math.ceil(Nv / scrV);

  var mainColStart = Math.floor((Nh - mainPxW) / 2);
  var mainColEnd = mainColStart + mainPxW;
  var mainRowStart = Math.floor((Nv - mainPxH) / 2);
  var mainRowEnd = mainRowStart + mainPxH;

  var remHDeg = 360 - mainHDeg;
  var remVDeg = 180 - mainVDeg;

  var gndScrW = Math.ceil(Ngnd / chW);
  var gndScrH = Math.ceil(Ngnd / chH);
  var gndChannels = gndScrW * gndScrH;

  // ===== 按区分屏（主屏最大 + 副屏逐步满载）=====
  // 副屏列宽算法：
  //   1块 → 取余
  //   2块 → 均分
  //   3+奇数 → nSub-1块满载chW，门口（中间）那块取余最小
  //   4+偶数 → nSub-1块满载chW，右门口那块取余最小
  function computeSubColWidths(remW, maxW) {
    if (remW <= 0) return [];
    var nSub = Math.ceil(remW / maxW);
    if (nSub === 1) return [remW];
    if (nSub === 2) {
      var half = remW / 2;
      return [half, half];
    }
    // nSub >= 3: nSub-1 块取 maxW，1 块取余
    var remainder = remW - (nSub - 1) * maxW;
    // 确定最小块在副屏序列中的位置（0-based，副屏从 mainEnd 起逆时针排列）
    var smallestIdx;
    if (nSub % 2 === 1) {
      // 奇数：门口（中间位置）最小
      smallestIdx = Math.floor(nSub / 2);
    } else {
      // 偶数：靠近右门口（中间偏右）最小
      smallestIdx = nSub / 2;
    }
    var widths = [];
    for (var i = 0; i < nSub; i++) {
      widths.push(i === smallestIdx ? remainder : maxW);
    }
    return widths;
  }

  function buildZoneScreens(zoneW, zoneH, maxW, maxH, zoneName) {
    var screens = [];
    var mw = Math.min(maxW, zoneW);
    var mh = Math.min(maxH, zoneH);

    // 横向列划分：第一列 = mw（主屏），副屏按规则分配
    var colWidths = [mw];
    var subCols = computeSubColWidths(zoneW - mw, maxW);
    for (var c = 0; c < subCols.length; c++) colWidths.push(subCols[c]);

    // 纵向行划分：第一行 = mh（主屏行），剩余高度均分
    var rowHeights = [mh];
    var remH = zoneH - mh;
    if (remH > 0) {
      var nRows = Math.ceil(remH / maxH);
      var rh = remH / nRows;
      for (var r = 0; r < nRows; r++) rowHeights.push(rh);
    }

    for (var r = 0; r < rowHeights.length; r++) {
      for (var c = 0; c < colWidths.length; c++) {
        var type = (r === 0 && c === 0) ? 'main' : 'supp';
        screens.push({ w: colWidths[c], h: rowHeights[r], type: type, zone: zoneName });
      }
    }
    return screens;
  }

  var erpScreens = [];
  erpScreens = erpScreens.concat(buildZoneScreens(Nh, rowsHemi, chW, chH, 'top'));
  erpScreens = erpScreens.concat(buildZoneScreens(Nh, rowsWall, chW, chH, 'wall'));

  // 横向列结构（所有区共用同一套列划分，因为 Nh 相同）
  var topMainW = Math.min(chW, Nh);
  var hColWidths = [topMainW];
  var subColWidthsArr = computeSubColWidths(Nh - topMainW, chW);
  for (var c = 0; c < subColWidthsArr.length; c++) hColWidths.push(subColWidthsArr[c]);
  var hColCount = hColWidths.length;
  var hasSub = hColCount > 1;
  var subW = hasSub ? hColWidths[1] : 0;
  var topH = rowsHemi;
  var wallH = rowsWall;

  var gndCellW = Math.ceil(Ngnd / gndScrW);
  var gndCellH = Math.ceil(Ngnd / gndScrH);
  var gndScreens = [];
  for (var gi = 0; gi < gndChannels; gi++) {
    gndScreens.push({ w: gndCellW, h: gndCellH, type: 'gnd', zone: 'gnd' });
  }

  var totalChannels = erpScreens.length + gndScreens.length;

  return {
    R: R, C: C, A_hemi: A_hemi, A_wall: A_wall, A_gnd: A_gnd, A_total: A_total,
    Nh: Nh, Nv: Nv, NvHemi: NvHemi, NvWall: NvWall, Ngnd: Ngnd, N_total: N_total,
    phiTopRad: phiTopRad, phiBotRad: phiBotRad,
    phiTopDeg: phiTopDeg, phiBotDeg: phiBotDeg,
    rowTop: rowTop, rowBot: rowBot, rowHorizon: rowHorizon,
    rowsHemi: rowsHemi, rowsWall: rowsWall, rowsGround: rowsGround,
    rowsHemiPct: rowsHemiPct, rowsWallPct: rowsWallPct, rowsGroundPct: rowsGroundPct,
    fovRad: fovRad, fovDeg: fovDeg, fl: fl, ppd: ppd,
    chW: chW, chH: chH,
    mainPxW: mainPxW, mainPxH: mainPxH,
    mainW: mainPxW, subW: subW, topH: topH, wallH: wallH,
    mainHDeg: mainHDeg, mainVDeg: mainVDeg,
    hColWidths: hColWidths, hColCount: hColCount, hasSub: hasSub,
    scrH: hColCount, scrV: scrV, scrTotal: scrTotal,
    cellW: cellW, cellH: cellH,
    mainColStart: mainColStart, mainColEnd: mainColEnd,
    mainRowStart: mainRowStart, mainRowEnd: mainRowEnd,
    remHDeg: remHDeg, remVDeg: remVDeg,
    gndScrW: gndScrW, gndScrH: gndScrH, gndChannels: gndChannels,
    gndCellW: gndCellW, gndCellH: gndCellH,
    erpScreens: erpScreens, gndScreens: gndScreens,
    totalChannels: totalChannels
  };
}

  var toggle = document.getElementById('mappingToggle');
  var wrap = document.getElementById('mappingDetailWrap');
  if (!toggle || !wrap) return;
  var expanded = wrap.classList.toggle('expanded');
  toggle.classList.toggle('expanded', expanded);

}

function onZoneTypeChange(zone) {
  var sel = document.getElementById('zoneType_' + zone);
  var priceInput = document.getElementById('zonePrice_' + zone);
  if (!sel || !priceInput) return;
  // 切换类型时更新默认单价（用户可随后手动修改）
  var defaultPrice = sel.value === 'custom' ? 8000 : 5000;
  priceInput.value = defaultPrice;
  updateCost();
}

function updateCost() {
  var P = getParams();
  var C = computeAll(P);
  var zones = [
    { key: 'top', area: C.A_hemi, name: '顶面', color: 'orange' },
    { key: 'wall', area: C.A_wall, name: '墙面', color: 'green' },
    { key: 'gnd', area: C.A_gnd, name: '地面', color: 'red' }
  ];
  var totalCost = 0;
  var html = '';
  zones.forEach(function(z) {
    var priceEl = document.getElementById('zonePrice_' + z.key);
    var price = priceEl ? parseFloat(priceEl.value) : 0;
    if (isNaN(price) || price < 0) price = 0;
    var cost = price * z.area;
    totalCost += cost;
    var costStr;
    if (cost >= 1e4) costStr = '¥ ' + (cost / 1e4).toFixed(1) + ' 万';
    else costStr = '¥ ' + cost.toFixed(0);
    html += '<div class="cost-display-row">';
    html += '<span class="cd-name" style="color:var(--c-' + z.color + ')">' + z.name + '</span>';
    html += '<span class="cd-area">' + fmtArea(z.area) + '</span>';
    html += '<span class="cd-price">× ¥' + price.toLocaleString() + '/m²</span>';
    html += '<span class="cd-subtotal">' + costStr + '</span>';
    html += '</div>';
  });
  var zonesEl = document.getElementById('costDisplay');
  if (zonesEl) zonesEl.innerHTML = html;

  var el = document.getElementById('costEstimate');
  if (!el) return;
  var costStr;
  if (totalCost >= 1e8) costStr = (totalCost / 1e8).toFixed(2) + ' 亿';
  else if (totalCost >= 1e4) costStr = (totalCost / 1e4).toFixed(1) + ' 万';
  else costStr = totalCost.toFixed(0);
  el.innerHTML = '<div class="cost-label">预估总造价</div><div class="cost-value">¥ ' + costStr + '</div>';
}

function resetParams() {
  setParam('D', 7.945);
  setParam('H', 2.88);
  setParam('P', 2.0);
  setParam('Eye', 1.50);
  document.getElementById('numChW').value = 7680;
  document.getElementById('numChH').value = 4320;
  // 重置屏幕造价配置
  document.getElementById('zoneType_top').value = 'custom';
  document.getElementById('zonePrice_top').value = 8000;
  document.getElementById('zoneType_wall').value = 'regular';
  document.getElementById('zonePrice_wall').value = 5000;
  document.getElementById('zoneType_gnd').value = 'regular';
  document.getElementById('zonePrice_gnd').value = 5000;
  onParamChange();
}

function setParam(key, val) {
  var cfg = sliderConfigs[key];
  var numEl = document.getElementById('num' + key);
  if (numEl) numEl.value = val.toFixed(cfg.decimals);
  var sliderEl = document.getElementById('slider' + key);
  if (sliderEl) {
    if (cfg.log) {
      sliderEl.value = valToLog(val, cfg.min, cfg.max);
    } else {
      sliderEl.value = val;
    }
  }
  // Sync menu input
  var menuEl = document.getElementById('menu' + key);
  if (menuEl) menuEl.value = val.toFixed(cfg.decimals);
}

function buildMappingDetailHTML() {
  var P = getParams();

    html += '<div class="formula-calc">' + calc + '</div>';

  }

  var html = '';

  html += row('圆柱侧面积 A_wall', 'A = C · h = πD · h', 'A = π × ' + formatNum(D, 3) + ' × ' + formatNum(h, 2), fmtArea(C.A_wall), 'green');
  html += row('地面面积 A_gnd', 'A = πR² = πD²/4', 'A = π × ' + formatNum(D, 3) + '² / 4', fmtArea(C.A_gnd), 'red');
  html += row('总显示面积 A_total', 'A = A_hemi + A_wall + A_gnd', 'A = ' + fmtArea(C.A_hemi) + ' + ' + fmtArea(C.A_wall) + ' + ' + fmtArea(C.A_gnd), fmtArea(C.A_total), 'blue');

  html += '<div class="section-title">② 像素规格</div>';
  html += row('水平总像素 N_h', 'N_h = C / p = πD / p', 'N_h = π × ' + formatNum(D, 3) + ' / ' + formatNum(p, 2) + 'mm', C.Nh.toLocaleString() + ' px', 'blue');
  html += row('垂直总像素 N_v', 'N_v = N_h / 2', 'N_v = ' + C.Nh.toLocaleString() + ' / 2', C.Nv.toLocaleString() + ' px', 'blue');
  html += row('半球垂直像素 N_v,hemi', 'N_v,hemi = N_v / 2', 'N_v,hemi = ' + C.Nv.toLocaleString() + ' / 2', C.NvHemi.toLocaleString() + ' px');
  html += row('墙面垂直像素 N_v,wall', 'N_v,wall = h / p', 'N_v,wall = ' + formatNum(h, 2) + 'm / ' + formatNum(p, 2) + 'mm', C.NvWall.toLocaleString() + ' px');
  html += row('地面像素 N_gnd', 'N_gnd = D / p', 'N_gnd = ' + formatNum(D, 3) + 'm / ' + formatNum(p, 2) + 'mm', C.Ngnd.toLocaleString() + ' px', 'red');
  html += row('总像素数 N_total', 'N_total = N_h × N_v', 'N_total = ' + C.Nh.toLocaleString() + ' × ' + C.Nv.toLocaleString(), fmtPx(C.N_total), 'blue');

  html += '<div class="section-title">③ 分界与行映射</div>';
  html += row('上分界角 φ_top', 'φ = arctan((h - h_eye) / R)', 'φ = arctan((' + formatNum(h, 2) + ' - ' + formatNum(P.h_eye, 2) + ') / ' + formatNum(R, 3) + ')', formatNum(C.phiTopRad, 4) + ' rad (' + formatNum(C.phiTopDeg, 2) + '°)', 'purple');
  html += row('下分界角 φ_bot', 'φ = arctan(-h_eye / R)', 'φ = arctan(-' + formatNum(P.h_eye, 2) + ' / ' + formatNum(R, 3) + ')', formatNum(C.phiBotRad, 4) + ' rad (' + formatNum(C.phiBotDeg, 2) + '°)', 'purple');
  html += row('上分界行号 Row_top', 'Row = round(N_v × (90° - φ°) / 180°)', 'Row = round(' + C.Nv.toLocaleString() + ' × (90 - ' + formatNum(C.phiTopDeg, 2) + ') / 180)', C.rowTop.toLocaleString(), 'purple');
  html += row('下分界行号 Row_bot', 'Row = round(N_v × (90° - φ°) / 180°)', 'Row = round(' + C.Nv.toLocaleString() + ' × (90 - ' + formatNum(C.phiBotDeg, 2) + ') / 180)', C.rowBot.toLocaleString(), 'purple');
  html += row('水平线行号 Row_horizon', 'Row = N_v / 2', 'Row = ' + C.Nv.toLocaleString() + ' / 2', C.rowHorizon.toLocaleString());
  html += row('半球区行数', 'rows = Row_top', 'rows = ' + C.rowTop.toLocaleString(), C.rowsHemi.toLocaleString() + ' (' + formatNum(C.rowsHemiPct, 1) + '%)', 'orange');
  html += row('墙面区行数', 'rows = Row_bot - Row_top', 'rows = ' + C.rowBot.toLocaleString() + ' - ' + C.rowTop.toLocaleString(), C.rowsWall.toLocaleString() + ' (' + formatNum(C.rowsWallPct, 1) + '%)', 'green');
  html += row('地面区行数', 'rows = N_v - Row_bot', 'rows = ' + C.Nv.toLocaleString() + ' - ' + C.rowBot.toLocaleString(), C.rowsGround.toLocaleString() + ' (' + formatNum(C.rowsGroundPct, 1) + '%)', 'red');

  html += '<div class="section-title">④ 人眼与质量指标</div>';
  html += row('地面人眼FOV', 'FOV = 2 · arctan(R / h_eye)', 'FOV = 2 × arctan(' + formatNum(R, 3) + ' / ' + formatNum(P.h_eye, 2) + ')', formatNum(C.fovRad, 4) + ' rad (' + formatNum(C.fovDeg, 2) + '°)', 'green');
  html += row('等效焦距 f', 'f = 36 / (2 · tan(FOV/2))', 'f = 36 / (2 × tan(' + formatNum(C.fovRad / 2, 4) + '))', formatNum(C.fl, 2) + ' mm', 'green');
  html += row('PPD 角分辨率', 'PPD = N_h / 360°', 'PPD = ' + C.Nh.toLocaleString() + ' / 360', formatNum(C.ppd, 2) + ' px/°', 'blue');

  html += '<div class="section-title">⑤ 分屏落地</div>';
  html += row('主屏宽', 'min(chW, N_h)', 'min(' + C.chW.toLocaleString() + ', ' + C.Nh.toLocaleString() + ')', C.mainW.toLocaleString() + ' px', 'blue');
  var nSubScreensF = C.hColCount - 1;
  var remWStrF = (C.Nh - C.mainW).toLocaleString();
  for (var ci2 = 1; ci2 < C.hColCount; ci2++) {
    var cName2 = nSubScreensF > 1 ? '副屏' + ci2 + '宽' : '副屏宽';
    var wF = C.hColWidths[ci2];
    var cForm2, cCalc2;
    if (nSubScreensF === 1) {
      cForm2 = 'N_h − 主屏宽'; cCalc2 = remWStrF + '（取余）';
    } else if (nSubScreensF === 2) {
      cForm2 = '(N_h − 主屏宽) / 2'; cCalc2 = '(' + remWStrF + ') / 2（均分）';
    } else if (wF >= C.chW - 0.5) {
      cForm2 = 'chW（满载）'; cCalc2 = 'chW = ' + C.chW.toLocaleString();
    } else {
      cForm2 = '余宽 − (n−1)×chW'; cCalc2 = remWStrF + ' − ' + (nSubScreensF - 1) + '×' + C.chW.toLocaleString() + '（取余）';
    }
    html += row(cName2, cForm2, cCalc2, wF.toLocaleString() + ' px', subColorNames[(ci2 - 1) % 4]);
  }
  html += row('顶面区高', 'N_v_hemi = Row_top', C.rowTop.toLocaleString(), C.topH.toLocaleString() + ' px (' + formatNum(C.rowsHemiPct, 1) + '%)', 'orange');
  html += row('墙面区高', 'N_v_wall = Row_bot − Row_top', C.rowBot.toLocaleString() + ' − ' + C.rowTop.toLocaleString(), C.wallH.toLocaleString() + ' px (' + formatNum(C.rowsWallPct, 1) + '%)', 'green');
  // 各区屏幕推导
  function emitFormulaScreens(zoneName, screens) {
    screens.sort(function(a, b) { return a.type === 'main' ? -1 : (b.type === 'main' ? 1 : 0); });
    var suppCount = screens.filter(function(s) { return s.type !== 'main'; }).length;
    var sIdx = 0;
    screens.forEach(function(s) {
      var sName, sColor;
      if (s.type === 'main') {
        sName = zoneName + '主屏';
        sColor = 'blue';
      } else {
        sIdx++;
        sName = suppCount > 1 ? zoneName + '副屏' + pad2(sIdx) : zoneName + '副屏';
        sColor = subColorNames[(sIdx - 1) % 4];
      }
      var sFormula = s.w.toLocaleString() + ' × ' + s.h.toLocaleString() + ' px';
      html += row(sName, '列宽 × 区高', sFormula, sFormula, sColor);
    });
  }
  emitFormulaScreens('顶面', C.erpScreens.filter(function(s) { return s.zone === 'top'; }));
  emitFormulaScreens('墙面', C.erpScreens.filter(function(s) { return s.zone === 'wall'; }));
  html += row('地面通道数', 'ceil(N_gnd/chW) × ceil(N_gnd/chH)', 'ceil(' + C.Ngnd.toLocaleString() + '/' + C.chW.toLocaleString() + ') × ceil(' + C.Ngnd.toLocaleString() + '/' + C.chH.toLocaleString() + ')', C.gndChannels + ' 通道', 'red');
  html += row('总通道数', 'ERP主副 + 地面', C.erpScreens.length + ' + ' + C.gndChannels, C.totalChannels + ' 通道', 'orange');

  return html;
}
