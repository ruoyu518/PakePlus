// ==================== 分屏落地（面板显示） ====================
function updateMultiScreen() {
  var P = getParams();
  var C = computeAll(P);
  var tc = tColors();
  var subCssVars = ['var(--c-orange)', 'var(--c-teal)', 'var(--c-magenta)', 'var(--c-brown)'];

  var html = '';

  // 大字：总通道数
  html += '<div class="ms-big">';
  html += '<div class="ms-label">总通道数</div>';
  html += '<div class="ms-value" style="color:var(--c-orange)">' + C.totalChannels + '<span style="font-size:13px;color:var(--text-sec);margin-left:4px">通道</span></div>';
  html += '</div>';

  // 屏幕列表 — 与输出示意图命名一致（按区分屏：主屏最大 + 副屏补余）
  html += '<div class="section-title">屏幕清单（共 ' + C.totalChannels + ' 块）</div>';

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function emitScreenList(screens, zoneName) {
    // 排序：主屏在前
    screens.sort(function(a, b) {
      if (a.type === 'main' && b.type !== 'main') return -1;
      if (a.type !== 'main' && b.type === 'main') return 1;
      return 0;
    });
    var suppCount = screens.filter(function(s) { return s.type !== 'main'; }).length;
    var subIdx = 0;
    screens.forEach(function(s) {
      var name;
      var colorClass;
      var inlineColor = '';
      if (s.type === 'main') { name = zoneName + '主屏'; colorClass = 'bl'; }
      else if (s.type === 'gnd') { subIdx++; name = suppCount > 1 ? '地面屏' + pad2(subIdx) : '地面屏'; colorClass = 'rd'; }
      else {
        subIdx++;
        name = suppCount > 1 ? zoneName + '副屏' + pad2(subIdx) : zoneName + '副屏';
        colorClass = '';
        inlineColor = ' style="color:' + subCssVars[(subIdx - 1) % 4] + '"';
      }
      var valClass = colorClass ? 'value ' + colorClass : 'value';
      html += '<div class="data-row"><span class="label">' + name + '</span><span class="' + valClass + '"' + inlineColor + '>' + s.w.toLocaleString() + ' × ' + s.h.toLocaleString() + ' px</span></div>';
    });
  }

  emitScreenList(C.erpScreens.filter(function(s) { return s.zone === 'top'; }), '顶面');
  emitScreenList(C.erpScreens.filter(function(s) { return s.zone === 'wall'; }), '墙面');
  emitScreenList(C.gndScreens, '地面');

  // 折叠区：详细分屏参数
  html += '<div class="mapping-collapse-toggle" id="multiToggle" onclick="toggleMultiDetail()">';
  html += '<span class="toggle-label">详细分屏参数</span>';
  html += '<span class="toggle-arrow">▶</span>';
  html += '</div>';
  html += '<div class="mapping-detail-wrap" id="multiDetailWrap">';

  html += '<div class="section-title">硬件限制</div>';
  html += '<div class="data-row"><span class="label">通道分辨率</span><span class="value bl">' + C.chW.toLocaleString() + ' × ' + C.chH.toLocaleString() + ' px</span></div>';
  html += '<div class="data-row"><span class="label">全景图尺寸</span><span class="value bl">' + C.Nh.toLocaleString() + ' × ' + C.Nv.toLocaleString() + ' px</span></div>';

  html += '<div class="section-title">横向分屏（主屏优先 + 副屏逐步满载）</div>';
  html += '<div class="data-row"><span class="label">主屏宽</span><span class="value gr">min(' + C.chW.toLocaleString() + ', ' + C.Nh.toLocaleString() + ') = ' + C.mainW.toLocaleString() + ' px</span></div>';
  var nSubScreens = C.hColCount - 1;
  var remWStr = (C.Nh - C.mainW).toLocaleString();
  for (var ci = 1; ci < C.hColCount; ci++) {
    var cColName = nSubScreens > 1 ? '副屏' + ci + '宽' : '副屏宽';
    var w = C.hColWidths[ci];
    var cFormula;
    if (nSubScreens === 1) {
      cFormula = remWStr + '（取余）';
    } else if (nSubScreens === 2) {
      cFormula = '(' + remWStr + ') / 2（均分）';
    } else if (w >= C.chW - 0.5) {
      cFormula = 'chW = ' + C.chW.toLocaleString() + '（满载）';
    } else {
      cFormula = remWStr + ' − ' + (nSubScreens - 1) + '×' + C.chW.toLocaleString() + '（取余）';
    }
    html += '<div class="data-row"><span class="label">' + cColName + '</span><span class="value gr">' + cFormula + ' = ' + w.toLocaleString() + ' px</span></div>';
  }
  html += '<div class="data-row"><span class="label">主屏覆盖</span><span class="value gr">' + formatNum(C.mainHDeg, 1) + '°（正面）</span></div>';

  // 各区屏幕详情（从 erpScreens 动态生成，含纵向分裂）
  function emitZoneDetail(zoneName, screens, zoneH, zonePct) {
    html += '<div class="section-title">' + zoneName + '区（区高 ' + zoneH.toLocaleString() + ' 行 / ' + formatNum(zonePct, 1) + '%）</div>';
    // 排序：主屏在前
    screens.sort(function(a, b) { return a.type === 'main' ? -1 : (b.type === 'main' ? 1 : 0); });
    var suppCount = screens.filter(function(s) { return s.type !== 'main'; }).length;
    var subIdx = 0;
    screens.forEach(function(s) {
      var name, valClass, inlineColor = '';
      if (s.type === 'main') {
        name = zoneName + '主屏';
        valClass = 'value bl';
      } else {
        subIdx++;
        name = suppCount > 1 ? zoneName + '副屏' + pad2(subIdx) : zoneName + '副屏';
        valClass = 'value';
        inlineColor = ' style="color:' + subCssVars[(subIdx - 1) % 4] + '"';
      }
      html += '<div class="data-row"><span class="label">' + name + '</span><span class="' + valClass + '"' + inlineColor + '>' + s.w.toLocaleString() + ' × ' + s.h.toLocaleString() + ' px</span></div>';
    });
  }
  emitZoneDetail('顶面', C.erpScreens.filter(function(s) { return s.zone === 'top'; }), C.topH, C.rowsHemiPct);
  emitZoneDetail('墙面', C.erpScreens.filter(function(s) { return s.zone === 'wall'; }), C.wallH, C.rowsWallPct);

  html += '<div class="section-title">地面屏</div>';
  html += '<div class="data-row"><span class="label">地面像素</span><span class="value rd">' + C.Ngnd.toLocaleString() + ' × ' + C.Ngnd.toLocaleString() + ' px</span></div>';
  html += '<div class="data-row"><span class="label">地面分屏</span><span class="value rd">' + C.gndScrW + ' × ' + C.gndScrH + ' 屏（每块 ' + C.gndCellW.toLocaleString() + ' × ' + C.gndCellH.toLocaleString() + ' px）</span></div>';

  html += '<div class="section-title">通道汇总</div>';
  html += '<div class="data-row"><span class="label">ERP通道</span><span class="value hl">' + C.erpScreens.length + '</span></div>';
  html += '<div class="data-row"><span class="label">地面通道</span><span class="value hl">' + C.gndScreens.length + '</span></div>';

  html += '</div>';

  document.getElementById('multiScreen').innerHTML = html;
}

function toggleMultiDetail() {
  var toggle = document.getElementById('multiToggle');
  var wrap = document.getElementById('multiDetailWrap');
  if (!toggle || !wrap) return;
  toggle.classList.toggle('expanded');
  wrap.classList.toggle('expanded');
}

// ==================== 映射示意图 ====================
function drawElevation() {
  var P = getParams();
  var C = computeAll(P);
  var R = C.R, h = P.h, he = P.h_eye;
  var tc = tColors();

  // 确保容器有尺寸（面板被隐藏时不重试）
  var container = document.getElementById('jxgbox');
  var elevPanel = document.getElementById('viewElevation');
  if (!container || container.clientWidth < 10 || container.clientHeight < 10) {
    if (elevPanel && elevPanel.classList.contains('window-hidden')) return;
    setTimeout(drawElevation, 100);
    return;
  }

  var maxDist = Math.max(
    h + R - he,
    Math.sqrt(R * R + (h - he) * (h - he)),
    Math.sqrt(R * R + he * he),
    R
  );
  var R_big = maxDist * 1.2;
  var pad = Math.max(R_big * 0.25, 1.5);

  board = JXG.JSXGraph.initBoard('jxgbox', {
    boundingbox: [-R_big - pad, h + R + pad * 0.8, R_big + pad, -pad * 0.8],
    axis: true,
    grid: false,
    keepAspectRatio: true,
    showCopyright: false,
    showNavigation: false,
    pan: { enabled: false },
    zoom: { enabled: false },
    defaultAxes: {
      x: { strokeColor: tc.axis, ticks: { strokeColor: tc.axis, majorHeight: 4, minorHeight: 0, label: { fontSize: 8, color: tc.textMuted } } },
      y: { strokeColor: tc.axis, ticks: { strokeColor: tc.axis, majorHeight: 4, minorHeight: 0, label: { fontSize: 8, color: tc.textMuted } } }
    }
  });

  var unit = Math.max(R / 4, 0.5);

  // 大球
  board.create('circle', [[0, he], R_big], {
    strokeColor: tc.blue, strokeWidth: 1.5, dash: 3, fillColor: tc.blue, fillOpacity: 0.02, name: ''
  });
  board.create('text', [R_big - unit, he + R_big / 2, '大球\n(全景图域)'], { fontSize: 10, color: tc.blue, anchorX: 'right' });

  // 地面
  board.create('segment', [[-R, 0], [R, 0]], { strokeColor: tc.red, strokeWidth: 4, name: '' });
  board.create('text', [0, -unit * 0.3, '地面 z=0  D=' + formatNum(P.D, 3) + 'm'], { fontSize: 10, color: tc.red, anchorX: 'middle' });

  // 墙面
  board.create('segment', [[-R, 0], [-R, h]], { strokeColor: tc.green, strokeWidth: 5, name: '' });
  board.create('segment', [[R, 0], [R, h]], { strokeColor: tc.green, strokeWidth: 5, name: '' });
  board.create('text', [-R - unit * 0.3, h / 2, '墙面\nh=' + formatNum(h, 2) + 'm'], { fontSize: 10, color: tc.green, anchorX: 'right' });

  // 半球
  board.create('curve', [
    function (t) { return R * Math.cos(t); },
    function (t) { return h + R * Math.sin(t); },
    0, Math.PI
  ], { strokeColor: tc.orange, strokeWidth: 4, name: '' });
  board.create('text', [0, h + R + unit * 0.3, '半球 R=' + formatNum(R, 3) + 'm'], { fontSize: 10, color: tc.orange, anchorX: 'middle' });

  // 人眼位置
  board.create('point', [0, he], {
    name: 'C', size: 7, face: 'o', strokeColor: tc.yellow, fillColor: tc.yellow,
    label: { fontSize: 13, color: tc.yellow, offset: [-12, 5], anchorX: 'right' }
  });
  board.create('text', [-unit * 0.1, he + unit * 0.2, '(0,' + formatNum(he, 2) + ')'], { fontSize: 9, color: tc.yellow, anchorX: 'right' });

  // 分界射线
  var phiTop = C.phiTopRad, phiBot = C.phiBotRad;
  var extLen = R + pad;
  board.create('segment', [[0, he], [extLen, he + extLen * Math.tan(phiTop)]], { strokeColor: tc.purple, strokeWidth: 2, dash: 2, name: '' });
  board.create('segment', [[0, he], [extLen, he + extLen * Math.tan(phiBot)]], { strokeColor: tc.purple, strokeWidth: 2, dash: 2, name: '' });

  // 分界点
  board.create('point', [R, h], { name: '', size: 4, face: 'o', strokeColor: tc.purple, fillColor: tc.purple });
  board.create('point', [R, 0], { name: '', size: 4, face: 'o', strokeColor: tc.purple, fillColor: tc.purple });
  board.create('text', [R + unit * 0.1, h, 'Row ' + C.rowTop.toLocaleString()], { fontSize: 11, color: tc.purple, fontWeight: 'bold' });
  board.create('text', [R + unit * 0.1, unit * 0.05, 'Row ' + C.rowBot.toLocaleString()], { fontSize: 11, color: tc.purple, fontWeight: 'bold' });

  // 角度弧
  var arcR = Math.max(unit * 0.6, 0.5);
  board.create('curve', [
    function (t) { return arcR * Math.cos(t); },
    function (t) { return he + arcR * Math.sin(t); },
    phiBot, phiTop
  ], { strokeColor: tc.purple, strokeWidth: 1.5, fillColor: tc.purple, fillOpacity: 0.08 });

  // 水平线
  board.create('segment', [[0, he], [R + pad * 0.5, he]], { strokeColor: tc.textSec, strokeWidth: 1, dash: 1, name: '' });

  // 区域标签
  board.create('text', [R + pad * 0.3, h + R / 2, '← 半球\n' + formatNum(C.rowsHemiPct, 1) + '%'], { fontSize: 10, color: tc.orange, fontWeight: 'bold' });
  board.create('text', [R + pad * 0.3, h / 2, '← 墙面\n' + formatNum(C.rowsWallPct, 1) + '%'], { fontSize: 10, color: tc.green, fontWeight: 'bold' });
  board.create('text', [R + pad * 0.3, -unit * 0.2, '← 地面\n' + formatNum(C.rowsGroundPct, 1) + '%'], { fontSize: 10, color: tc.red, fontWeight: 'bold' });

  board.fullUpdate();
}

// 将弧度转换为钟点（1-12，四舍五入到最近整点）
function radToClock(rad) {
  var h = 3 - rad * 6 / Math.PI;   // 12点=π/2 → h=0→12；3点=0 → h=3；6点=-π/2 → h=6
  h = ((h % 12) + 12) % 12;
  if (h === 0) h = 12;
  return Math.round(h);
}

// ==================== 分屏示意图（俯视图） ====================
function drawTopView() {
  var P = getParams();
  var C = computeAll(P);
  var R = C.R;
  var tc = tColors();
  var pad = Math.max(R * 0.55, 1.8);

  // 确保容器有尺寸（面板被隐藏时不重试）
  var container = document.getElementById('jxgboxTop');
  var topPanel = document.getElementById('viewTop');
  if (!container || container.clientWidth < 10 || container.clientHeight < 10) {
    if (topPanel && topPanel.classList.contains('window-hidden')) return;
    setTimeout(drawTopView, 100);
    return;
  }

  boardTop = JXG.JSXGraph.initBoard('jxgboxTop', {
    boundingbox: [-R - pad, R + pad, R + pad, -R - pad],
    axis: false,
    grid: false,
    keepAspectRatio: true,
    showCopyright: false,
    showNavigation: false,
    pan: { enabled: false },
    zoom: { enabled: false }
  });

  var unit = Math.max(R / 5, 0.3);

  // ===== 钟表定位盘（12等分，替代直角坐标系） =====
  var clockR = R + pad * 0.93;          // 钟面半径，接近视口边缘
  var tickOuter = clockR;                // 刻度外端
  var tickInnerMajor = clockR * 0.88;    // 整点刻度内端（3/6/9/12）
  var tickInnerMinor = clockR * 0.93;    // 其他刻度内端
  var labelR = clockR + pad * 0.07;      // 钟点标签半径

  // 钟面外圈（虚线）
  boardTop.create('circle', [[0, 0], clockR], {
    strokeColor: tc.axis, strokeWidth: 1, dash: 2, fillColor: 'transparent', name: ''
  });

  // 十字参考线（3-9 和 6-12）
  boardTop.create('segment', [
    [-clockR * 0.98, 0], [clockR * 0.98, 0]
  ], { strokeColor: tc.axis, strokeWidth: 0.5, dash: 3, name: '' });
  boardTop.create('segment', [
    [0, -clockR * 0.98], [0, clockR * 0.98]
  ], { strokeColor: tc.axis, strokeWidth: 0.5, dash: 3, name: '' });

  // 12个钟点
  for (var h = 1; h <= 12; h++) {
    var hourAngle = Math.PI / 2 - h * Math.PI / 6;  // 12点 = 正上方，顺时针递增
    var isMajor = (h % 3 === 0);  // 3/6/9/12 为整点
    var tInner = isMajor ? tickInnerMajor : tickInnerMinor;

    // 刻度线
    boardTop.create('segment', [
      [tInner * Math.cos(hourAngle), tInner * Math.sin(hourAngle)],
      [tickOuter * Math.cos(hourAngle), tickOuter * Math.sin(hourAngle)]
    ], {
      strokeColor: tc.axis, strokeWidth: isMajor ? 1.5 : 1, name: ''
    });

    // 钟点数字
    boardTop.create('text', [
      labelR * Math.cos(hourAngle),
      labelR * Math.sin(hourAngle),
      h.toString()
    ], {
      fontSize: isMajor ? 12 : 10,
      color: isMajor ? tc.textSec : tc.textMuted,
      anchorX: 'middle', anchorY: 'middle',
      fontWeight: isMajor ? 'bold' : 'normal'
    });
  }

  // 门参数：1m宽，正下方
  var doorW = 1.0;
  var doorHalfAng = Math.asin(Math.min(doorW / 2 / R, 1));
  var doorCenter = -Math.PI / 2;
  var doorStart = doorCenter - doorHalfAng;
  var doorEnd = doorCenter + doorHalfAng;

  // LED墙圆（绿色），跳过门的位置 — 从doorEnd绕到doorStart+2π
  boardTop.create('curve', [
    function(t) { return R * Math.cos(t); },
    function(t) { return R * Math.sin(t); },
    doorEnd, doorStart + 2 * Math.PI
  ], { strokeColor: tc.green, strokeWidth: 4, fillColor: tc.green, fillOpacity: 0.04, name: '' });

  // 门标记
  var dP1 = [R * Math.cos(doorStart), R * Math.sin(doorStart)];
  var dP2 = [R * Math.cos(doorEnd), R * Math.sin(doorEnd)];
  boardTop.create('segment', [dP1, dP2], { strokeColor: tc.red, strokeWidth: 3, dash: 1, name: '' });
  boardTop.create('text', [0, -R - pad * 0.25, '门'], { fontSize: 12, color: tc.red, anchorX: 'middle', fontWeight: 'bold' });

  // 主画面参数：正上方 = π/2
  var forward = Math.PI / 2;
  var halfMain = C.mainHDeg / 2 * Math.PI / 180;
  if (halfMain > Math.PI) halfMain = Math.PI;
  var mainStart = forward - halfMain;
  var mainEnd = forward + halfMain;

  // 主画面弧（蓝色高亮，在墙圆稍外侧）
  boardTop.create('curve', [
    function(t) { return R * 1.03 * Math.cos(t); },
    function(t) { return R * 1.03 * Math.sin(t); },
    mainStart, mainEnd
  ], { strokeColor: tc.blue, strokeWidth: 6, fillColor: tc.blue, fillOpacity: 0.12, highlight: false });

  // 副屏弧（每块独立绘制，不同颜色区分）
  var subColors = subScreenColors(tc);
  if (C.hColCount > 1) {
    var cumAng = mainEnd;
    for (var si = 1; si < C.hColCount; si++) {
      var sColDeg = C.hColWidths[si] / C.ppd;
      var sStart = cumAng;
      var sEnd = cumAng + sColDeg * Math.PI / 180;
      if (sEnd > mainStart + 2 * Math.PI) sEnd = mainStart + 2 * Math.PI;
      var sc = subColors[(si - 1) % subColors.length];
      boardTop.create('curve', [
        function(t) { return R * 1.03 * Math.cos(t); },
        function(t) { return R * 1.03 * Math.sin(t); },
        sStart, sEnd
      ], { strokeColor: sc, strokeWidth: 5, fillColor: sc, fillOpacity: 0.10, highlight: false });
      cumAng = sEnd;
    }
  }

  // 分界虚线 — 主画面两侧（紫色）
  var lineExt = 1.18;
  boardTop.create('segment', [
    [0, 0], [R * lineExt * Math.cos(mainStart), R * lineExt * Math.sin(mainStart)]
  ], { strokeColor: tc.purple, strokeWidth: 2, dash: 2, name: '' });
  boardTop.create('segment', [
    [0, 0], [R * lineExt * Math.cos(mainEnd), R * lineExt * Math.sin(mainEnd)]
  ], { strokeColor: tc.purple, strokeWidth: 2, dash: 2, name: '' });

  // 人眼位置
  boardTop.create('point', [0, 0], {
    name: 'C', size: 7, face: 'o', strokeColor: tc.yellow, fillColor: tc.yellow,
    label: { fontSize: 14, color: tc.yellow, offset: [-15, -15] }
  });

  // 前方箭头（正上方）
  boardTop.create('arrow', [[0, 0], [0, R + pad * 0.3]], {
    strokeColor: tc.textSec, strokeWidth: 1.5, dash: 1, name: ''
  });
  boardTop.create('text', [unit * 0.3, R + pad * 0.25, '前方'], { fontSize: 10, color: tc.textSec });

  // 主画面标签（正上方外侧）
  var labelR = R * 1.3;
  var mainEndClock = radToClock(mainEnd);
  var mainStartClock = radToClock(mainStart);
  boardTop.create('text', [
    labelR * Math.cos(forward), labelR * Math.sin(forward),
    '主屏 ' + C.mainW.toLocaleString() + 'px 占' + formatNum(C.mainHDeg, 1) + '°（' + mainEndClock + '点→' + mainStartClock + '点方向）'
  ], { fontSize: 12, color: tc.blue, anchorX: 'middle', fontWeight: 'bold' });

  // 副屏标签 — 紧跟弧线中点，颜色与弧线一致，标注钟点方向
  if (C.hColCount > 1) {
    var sCumAng = mainEnd;  // 从主屏结束处开始累积（弧度）
    for (var i = 1; i < C.hColCount; i++) {
      var colDeg = C.hColWidths[i] / C.ppd;
      var colRad = colDeg * Math.PI / 180;
      var sMid = sCumAng + colRad / 2;   // 弧线中点
      var sLabelR = R * 0.55;
      var sName = C.hColCount > 2 ? '副屏' + i : '副屏';
      var sColor = subColors[(i - 1) % subColors.length];
      var sStartClock = radToClock(sCumAng);
      var sEndClock = radToClock(sCumAng + colRad);
      boardTop.create('text', [
        sLabelR * Math.cos(sMid), sLabelR * Math.sin(sMid),
        sName + ' ' + C.hColWidths[i].toLocaleString() + 'px 占' + formatNum(colDeg, 1) + '°（' + sEndClock + '点→' + sStartClock + '点方向）'
      ], { fontSize: 10, color: sColor, anchorX: 'middle', fontWeight: 'bold' });
      sCumAng += colRad;   // 累积弧度
    }
  }

  // 分界角度标签
  var halfDeg = C.mainHDeg / 2;
  boardTop.create('text', [
    R * 1.35 * Math.cos(mainStart), R * 1.35 * Math.sin(mainStart),
    '-' + formatNum(halfDeg, 0) + '°'
  ], { fontSize: 9, color: tc.purple, anchorX: 'middle' });
  boardTop.create('text', [
    R * 1.35 * Math.cos(mainEnd), R * 1.35 * Math.sin(mainEnd),
    '+' + formatNum(halfDeg, 0) + '°'
  ], { fontSize: 9, color: tc.purple, anchorX: 'middle' });

  // LED墙标签
  boardTop.create('text', [
    R + pad * 0.2, -R * 0.35,
    'LED墙 R=' + formatNum(R, 2) + 'm\n周长=' + formatNum(C.C, 1) + 'm'
  ], { fontSize: 10, color: tc.green, anchorX: 'left' });

  boardTop.fullUpdate();
}

// ==================== 输出示意图（三行：顶面 / 墙面 / 地面） ====================
function drawOutputDiagram() {
  var P = getParams();
  var C = computeAll(P);
  var tc = tColors();

  // 三区域分类
  var topScreens = [];
  var wallScreens = [];
  var gndScreens = [];

  // 复用 computeAll 的按区分屏结果（主屏最大 + 副屏补余，垂直已分区）
  C.erpScreens.forEach(function(s) {
    if (s.zone === 'top') topScreens.push(s);
    else if (s.zone === 'wall') wallScreens.push(s);
  });
  C.gndScreens.forEach(function(s) { gndScreens.push(s); });

  // 缩放：最大边映射到 130px
  var allScreens = topScreens.concat(wallScreens, gndScreens);
  var maxDim = 0;
  allScreens.forEach(function(s) { maxDim = Math.max(maxDim, s.w, s.h); });
  var scale = 130 / maxDim;

  // 颜色映射（主题自适应）
  function hexToRgba(hex, a) {
    if (!hex || hex[0] !== '#' || hex.length < 7) return 'rgba(128,128,128,' + a + ')';
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function chColor(type, subIdx) {
    if (type === 'main') return { border: tc.blue, bg: hexToRgba(tc.blue, 0.1), text: tc.blue };
    if (type === 'supp') {
      var sc = subScreenColors(tc)[(subIdx - 1) % 4];
      return { border: sc, bg: hexToRgba(sc, 0.08), text: sc };
    }
    return { border: tc.red, bg: hexToRgba(tc.red, 0.06), text: tc.red };
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // 构建分区数据
  var sections = [
    { title: '顶面', screens: topScreens, zoneName: '顶面', coord: '像素行 0 ~ ' + C.rowTop.toLocaleString() + '（' + C.topH.toLocaleString() + ' 行） / 共 ' + C.Nh.toLocaleString() + ' 列' },
    { title: '墙面', screens: wallScreens, zoneName: '墙面', coord: '像素行 ' + C.rowTop.toLocaleString() + ' ~ ' + C.rowBot.toLocaleString() + '（' + C.wallH.toLocaleString() + ' 行） / 共 ' + C.Nh.toLocaleString() + ' 列' },
    { title: '地面', screens: gndScreens, zoneName: '地面', coord: '地面渲染 · ' + C.Ngnd.toLocaleString() + ' × ' + C.Ngnd.toLocaleString() + ' px（' + C.gndScreens.length + ' 通道）' }
  ];

  // 排序：主屏在前
  sections.forEach(function(sec) {
    sec.screens.sort(function(a, b) {
      if (a.type === 'main' && b.type !== 'main') return -1;
      if (a.type !== 'main' && b.type === 'main') return 1;
      return 0;
    });
  });

  // 构建扁平矩形数据（用于原地更新或全量重建）
  function getRectName(ch, zoneName, suppCount, subIdx) {
    if (ch.type === 'main') return zoneName + '主屏';
    if (ch.type === 'gnd') return suppCount > 1 ? '地面屏' + pad2(subIdx) : '地面屏';
    return suppCount > 1 ? zoneName + '副屏' + pad2(subIdx) : zoneName + '副屏';
  }

  var rectData = [];
  sections.forEach(function(sec) {
    if (sec.screens.length === 0) return;
    var suppCount = sec.screens.filter(function(ch) { return ch.type !== 'main'; }).length;
    var subIdx = 0;
    sec.screens.forEach(function(ch) {
      var rw = Math.max(Math.round(ch.w * scale), 70);
      var rh = Math.max(Math.round(ch.h * scale), 55);
      if (ch.type !== 'main') subIdx++;
      var col = chColor(ch.type, subIdx);
      var name = getRectName(ch, sec.zoneName, suppCount, subIdx);
      rectData.push({
        rw: rw, rh: rh,
        borderColor: col.border, bgColor: col.bg, textColor: col.text,
        name: name,
        dims: ch.w.toLocaleString() + ' × ' + ch.h.toLocaleString() + ' px'
      });
    });
  });

  var el = document.getElementById('outputDiagram');
  if (!el) return;

  // 检查是否可原地更新（矩形数量不变时）
  var existingRects = el.querySelectorAll('.output-rect');
  var sig = String(rectData.length);
  var oldSig = el.getAttribute('data-sig');

  if (oldSig === sig && existingRects.length === rectData.length) {
    // 原地更新——CSS transition 自动动画
    rectData.forEach(function(r, i) {
      var rect = existingRects[i];
      rect.style.minWidth = r.rw + 'px';
      rect.style.minHeight = r.rh + 'px';
      rect.style.borderColor = r.borderColor;
      rect.style.background = r.bgColor;
      var nameEl = rect.querySelector('.rect-name');
      var dimsEl = rect.querySelector('.rect-dims');
      if (nameEl) { nameEl.textContent = r.name; nameEl.style.color = r.textColor; }
      if (dimsEl) dimsEl.textContent = r.dims;
    });
    // 更新总计
    var totalEl = el.querySelector('.output-total');
    if (totalEl) {
      totalEl.innerHTML = '共 <strong style="color:' + tc.orange + ';font-size:14px">' + C.totalChannels + '</strong> 通道（ERP ' + C.erpScreens.length + ' + 地面 ' + C.gndScreens.length + '）';
    }
    // 更新坐标标注
    var coordEls = el.querySelectorAll('.section-coord');
    sections.forEach(function(sec, i) {
      if (coordEls[i]) coordEls[i].textContent = sec.coord;
    });
  } else {
    // 结构变化——全量重建
    var html = '';
    sections.forEach(function(sec) {
      if (sec.screens.length === 0) return;
      var suppCount2 = sec.screens.filter(function(ch) { return ch.type !== 'main'; }).length;
      html += '<div class="output-section">';
      html += '<div class="output-section-title">' + sec.title + '（' + sec.screens.length + '屏）</div>';
      html += '<div class="section-coord">' + sec.coord + '</div>';
      html += '<div class="output-row">';
      var subIdx2 = 0;
      sec.screens.forEach(function(ch) {
        var rw = Math.max(Math.round(ch.w * scale), 70);
        var rh = Math.max(Math.round(ch.h * scale), 55);
        if (ch.type !== 'main') subIdx2++;
        var col = chColor(ch.type, subIdx2);
        var name = getRectName(ch, sec.zoneName, suppCount2, subIdx2);
        html += '<div class="output-rect" style="min-width:' + rw + 'px;min-height:' + rh + 'px;border-color:' + col.border + ';background:' + col.bg + ';color:' + col.text + '">';
        html += '<div class="rect-name" style="color:' + col.text + '">' + name + '</div>';
        html += '<div class="rect-dims">' + ch.w.toLocaleString() + ' × ' + ch.h.toLocaleString() + ' px</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    html += '<div class="output-total" style="flex-shrink:0;font-size:12px;color:' + tc.textSec + ';padding:4px 8px;white-space:nowrap">';
    html += '共 <strong style="color:' + tc.orange + ';font-size:14px">' + C.totalChannels + '</strong> 通道';
    html += '（ERP ' + C.erpScreens.length + ' + 地面 ' + C.gndScreens.length + '）';
    html += '</div>';
    el.innerHTML = html;
    el.setAttribute('data-sig', sig);
  }
}

// ==================== 示意图交互（左键/中键平移 + 滚轮缩放） ====================
function setupDiagramInteractions() {
  function setup(containerId, getBoardFn) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var panning = false;
    var lastX = 0, lastY = 0;

    // 鼠标按下 → 开始平移（左键 button=0 或 中键 button=1）
    // 用 capture:true 在 JSXGraph 的 SVG 处理之前拦截事件
    container.addEventListener('mousedown', function(e) {
      if (e.button === 0 || e.button === 1) {
        e.preventDefault();
        e.stopPropagation();
        panning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        container.style.cursor = 'grabbing';
      }
    }, { capture: true });

    // 鼠标移动 → 平移
    document.addEventListener('mousemove', function(e) {
      if (!panning) return;
      var b = getBoardFn();
      if (!b) { panning = false; return; }
      var dx = e.clientX - lastX;
      var dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      var bb = b.getBoundingBox(); // [x1, y1_top, x2, y2_bottom]
      var w = container.clientWidth;
      var h = container.clientHeight;
      if (w === 0 || h === 0) return;

      // 像素位移 → 坐标位移
      var shiftX = -(bb[2] - bb[0]) * dx / w;
      var shiftY = (bb[1] - bb[3]) * dy / h;

      b.setBoundingBox([
        bb[0] + shiftX, bb[1] + shiftY,
        bb[2] + shiftX, bb[3] + shiftY
      ], false);
    });

    // 鼠标松开 → 停止平移
    document.addEventListener('mouseup', function() {
      if (panning) {
        panning = false;
        container.style.cursor = 'grab';
      }
    });

    // 阻止中键自动滚动
    container.addEventListener('auxclick', function(e) {
      if (e.button === 1) e.preventDefault();
    }, { capture: true });

    // 滚轮缩放（以鼠标位置为中心）—— 用 capture 确保先于 JSXGraph 处理
    container.addEventListener('wheel', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var b = getBoardFn();
      if (!b) return;

      var bb = b.getBoundingBox(); // [x1, y1_top, x2, y2_bottom]
      var rect = container.getBoundingClientRect();
      // 鼠标在容器内的比例位置
      var mx = (e.clientX - rect.left) / rect.width;
      var my = (e.clientY - rect.top) / rect.height;
      // 鼠标对应的坐标位置
      var bx = bb[0] + mx * (bb[2] - bb[0]);
      var by = bb[3] + (1 - my) * (bb[1] - bb[3]);

      // 缩放因子：滚轮向上(deltaY<0)放大，向下(deltaY>0)缩小
      var factor = e.deltaY < 0 ? 1 / 1.15 : 1.15;

      // 以鼠标位置为中心缩放
      b.setBoundingBox([
        bx - (bx - bb[0]) * factor,
        by + (bb[1] - by) * factor,
        bx + (bb[2] - bx) * factor,
        by - (by - bb[3]) * factor
      ], false);
    }, { capture: true, passive: false });

    // 鼠标悬停 → 显示手势光标
    container.addEventListener('mouseenter', function() {
      if (!panning) container.style.cursor = 'grab';
    });
    container.addEventListener('mouseleave', function() {
      if (!panning) container.style.cursor = '';
    });
  }

  setup('jxgbox', function() { return board; });
  setup('jxgboxTop', function() { return boardTop; });
}

// ==================== 窗口管理（面板显示/隐藏） ====================
var windowPanels = ['viewElevation', 'viewTop', 'viewOutput', 'cardInput', 'cardCost', 'cardMapping', 'cardMultiScreen'];

function toggleWindow(panelId, menuItem) {
  var el = document.getElementById(panelId);
  if (!el) return;
  var isHidden = el.classList.toggle('window-hidden');
  if (menuItem) {
    menuItem.classList.toggle('hidden', isHidden);
  }
  // 保存状态
  var state = {};
  windowPanels.forEach(function(id) {
    var e = document.getElementById(id);
    state[id] = e ? e.classList.contains('window-hidden') : false;
  });
  localStorage.setItem('rvr-windows', JSON.stringify(state));
  // 自适应布局：两个示意图都隐藏时输出图占满
  var elevHidden = document.getElementById('viewElevation').classList.contains('window-hidden');
  var topHidden = document.getElementById('viewTop').classList.contains('window-hidden');
  var outEl = document.getElementById('viewOutput');
  if (elevHidden && topHidden) {
    outEl.style.flex = '1';
    outEl.style.maxHeight = 'none';
  } else {
    outEl.style.flex = '';
    outEl.style.maxHeight = '';
  }
  // 示意图变化后需要重绘
  setTimeout(function() {
    onResize();
    // 重绘示意图（容器尺寸可能变化）
    if (board) { JXG.JSXGraph.freeBoard(board); board = null; }
    if (boardTop) { JXG.JSXGraph.freeBoard(boardTop); boardTop = null; }
    var el1 = document.getElementById('jxgbox');
    var el2 = document.getElementById('jxgboxTop');
    if (el1) el1.innerHTML = '';
    if (el2) el2.innerHTML = '';
    drawElevation();
    drawTopView();
  }, 50);
}

function restoreWindowStates() {
  var saved = localStorage.getItem('rvr-windows');
  if (!saved) return;
  var state;
  try { state = JSON.parse(saved); } catch(e) { return; }
  windowPanels.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (state[id]) {
      el.classList.add('window-hidden');
      // 同步菜单勾选状态
      var menuItem = document.querySelector('.menu-item-check[onclick*="' + id + '"]');
      if (menuItem) menuItem.classList.add('hidden');
    }
  });
  // 自适应布局
  var elevHidden = document.getElementById('viewElevation').classList.contains('window-hidden');
  var topHidden = document.getElementById('viewTop').classList.contains('window-hidden');
  var outEl = document.getElementById('viewOutput');
  if (elevHidden && topHidden) {
    outEl.style.flex = '1';
    outEl.style.maxHeight = 'none';
  }
}

// ==================== 响应式 ====================
var _lastLayoutWide = null;
var _resizeTimer = null;
function onResize() {
  // 检测横竖屏切换
  var isWide = window.innerWidth / window.innerHeight > 1.2;
  if (_lastLayoutWide !== null && _lastLayoutWide !== isWide) {
    // 横竖屏切换 → 重绘所有图表
    if (_resizeTimer) clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function() {
      drawElevation();
      drawTopView();
      drawOutputDiagram();
    }, 200);
    _lastLayoutWide = isWide;
    return;
  }
  _lastLayoutWide = isWide;
  // 普通缩放 → 调整容器尺寸
  var views = document.querySelectorAll('.view-half');
  if (views.length >= 2) {
    var w1 = views[0].clientWidth, h1 = views[0].clientHeight;
    var w2 = views[1].clientWidth, h2 = views[1].clientHeight;
    if (board && w1 > 0 && h1 > 0) board.resizeContainer(w1, h1);
    if (boardTop && w2 > 0 && h2 > 0) boardTop.resizeContainer(w2, h2);
  }
}

// ==================== 初始化 ====================
window.addEventListener('load', function() {
  // 应用保存的主题
  var savedTheme = localStorage.getItem('rvr-theme') || 'dark';
  setTheme(savedTheme);
  // 应用保存的字体缩放
  var savedScale = parseFloat(localStorage.getItem('rvr-font-scale')) || 1;
  setFontScale(savedScale);
  // 恢复窗口面板显示/隐藏状态
  restoreWindowStates();
  // setTheme → setTimeout(onParamChange, 50) 会自动执行：
  //   updateResults + updateDataRows + updateMultiScreen + drawElevation + drawTopView
  // 设置示意图交互（左键/中键平移 + 滚轮缩放）
  setupDiagramInteractions();
  // 初始化横竖屏状态，避免首次 onResize 触发重绘
  _lastLayoutWide = window.innerWidth / window.innerHeight > 1.2;
  // 延迟调用 onResize 确保图表尺寸正确
  setTimeout(onResize, 300);
});

window.addEventListener('resize', onResize);
</script>
